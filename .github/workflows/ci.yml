name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-concurrency:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Syntax Check Server Entry Point
        run: |
          cd backend
          node --check server.js

      - name: Seed Database & Execute Concurrency Stress Test
        env:
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/feedants_ci
        run: |
          cd backend
          npm run seed
          npm run dev &
          
          # Healthcheck polling loop: wait up to 15s for the server to be ready
          echo "Waiting for API to respond on http://localhost:5000/api/v1/competitions/primary..."
          for i in {1..15}; do
            if curl -s http://localhost:5000/api/v1/competitions/primary > /dev/null; then
              echo "Server is ready!"
              break
            fi
            sleep 1
          done

          npm run test:concurrency