name: Backend CI & Concurrency Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Verify Seed & Concurrency Locking
        env:
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/feedants_test
        run: |
          cd backend
          npm run seed
          npm start &
          sleep 3
          npm run test:concurrency